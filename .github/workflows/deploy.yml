##############################################################################
#  GitHub Actions — CI/CD for StudentInfoSystem → AWS ECS Fargate
#
#  Required GitHub Secrets (Settings → Secrets and variables → Actions):
#    AWS_ACCESS_KEY_ID       — IAM user access key
#    AWS_SECRET_ACCESS_KEY   — IAM user secret key
##############################################################################

name: Build & Deploy to AWS ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION:       us-east-1
  ECR_BACKEND:      studentinfo-backend
  ECR_FRONTEND:     studentinfo-frontend
  ECS_CLUSTER:      studentinfo-cluster
  ECS_SERVICE:      studentinfo-service
  TASK_FAMILY:      studentinfo-task
  BACKEND_CONTAINER:  backend
  FRONTEND_CONTAINER: frontend

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Configure AWS credentials ─────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 3. Login to Amazon ECR ───────────────────────────────────────────
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Build & push backend image ────────────────────────────────────
      - name: Build & push backend Docker image
        id: build-backend
        env:
          REGISTRY:   ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG:  ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_BACKEND:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" StudentInfoSystem/backend
          docker push "$IMAGE_URI"
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      # ── 5. Build & push frontend image ───────────────────────────────────
      - name: Build & push frontend Docker image
        id: build-frontend
        env:
          REGISTRY:   ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG:  ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_FRONTEND:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" StudentInfoSystem/frontend
          docker push "$IMAGE_URI"
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      # ── 6. Download current task definition ──────────────────────────────
      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_FAMILY }} \
            --query taskDefinition \
            > task-definition.json

      # ── 7. Render new task definition with updated backend image ─────────
      - name: Render task definition — backend
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  task-definition.json
          container-name:   ${{ env.BACKEND_CONTAINER }}
          image:            ${{ steps.build-backend.outputs.image }}

      # ── 8. Render new task definition with updated frontend image ─────────
      - name: Render task definition — frontend
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  ${{ steps.render-backend.outputs.task-definition }}
          container-name:   ${{ env.FRONTEND_CONTAINER }}
          image:            ${{ steps.build-frontend.outputs.image }}

      # ── 9. Deploy to ECS ─────────────────────────────────────────────────
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          cluster:         ${{ env.ECS_CLUSTER }}
          service:         ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
