name: Deploy Web App and Static Web App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup .NET for Backend
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # 3. Build and Publish Backend
      - name: Build and Publish Backend
        run: |
          dotnet restore backend/src/StudentInfo.Api/StudentInfo.Api.csproj
          dotnet publish backend/src/StudentInfo.Api/StudentInfo.Api.csproj -c Release -o ./publish

      # 4. Deploy Backend to Azure Web App
      - name: Deploy Backend to Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

      # 5. Setup Node for Frontend
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # 6. Deploy Frontend to SWA (Let SWA Action handle the build)
      - name: Deploy Frontend to SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          output_location: "dist"
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          app_location: "frontend"

          # Location of the build output (dist or build folder)
          app_artifact_location: "dist"

          # If you don't have a separate Azure Function API in the SWA
          api_location: ""

          # Use the built-in Oryx builder
          skip_app_build: false
