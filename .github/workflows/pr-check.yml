name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  # ── Backend build check ──────────────────────────────────
  backend-check:
    name: .NET Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend/src/StudentInfo.Api/StudentInfo.Api.csproj

      - name: Build
        run: dotnet build backend/src/StudentInfo.Api/StudentInfo.Api.csproj \
               --no-restore -c Release

  # ── Frontend build check ─────────────────────────────────
  frontend-check:
    name: React Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Docker build check (no push) ─────────────────────────
  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file:    ./backend/Dockerfile
          push:    false

      - name: Build frontend Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file:    ./frontend/Dockerfile
          push:    false
