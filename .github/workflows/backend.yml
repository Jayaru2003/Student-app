name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

env:
  AZURE_WEBAPP_NAME:    studentapp
  PROJECT_PATH:         backend/src/StudentInfo.Api/StudentInfo.Api.csproj
  DOTNET_VERSION:       "8.0.x"

jobs:
  # ── 1. Build & Test ───────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore packages
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --no-restore -c Release

      - name: Run tests (if test project exists)
        run: |
          if [ -f backend/StudentInfo.Api.Tests/StudentInfo.Api.Tests.csproj ]; then
            dotnet test backend/StudentInfo.Api.Tests/StudentInfo.Api.Tests.csproj \
              --no-restore --verbosity normal
          else
            echo "No test project found — skipping."
          fi

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish --no-restore

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ./publish
          retention-days: 1

  # ── 2. Deploy to Azure App Service ────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name:        ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package:         ./publish

      - name: Smoke test — health check
        run: |
          echo "Waiting 30s for app to warm up..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://studentapp-a7b0eebkcphebpe8.indonesiacentral-01.azurewebsites.net/health)
          echo "Health endpoint status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
